name: mantra_tuner
description: A complete Flutter application for Mantra Tuning, Chakra Meditation, and Analytics.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  record: ^7.1.1
  path_provider: ^2.1.1
  cupertino_icons: 1.0.8
  sound_generator: ^0.0.14
  pitch_detector_dart: ^0.0.7
  just_audio: ^0.10.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
